<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAAIA Dashboard</title>

  <!-- Dependencias -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f4f4f4;
}

.header {
  margin-bottom: 30px;
  background: white;
  padding: 20px 30px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.title-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  width: 100%;
}

.title-text {
  flex: 1;
}

.logo {
  width: 260px;
  height: auto;
  object-fit: contain;
  margin-top: 18px;
}

h1 {
  color: #7b1e2b;
  margin: 0;
}

h2 {
  margin-top: 5px;
  font-weight: normal;
  color: #555;
  font-size: 18px;
}

.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

select {
  padding: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
  background: white;
}

.pdf-btn {
  background: #7b1e2b;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: .2s;
}

.pdf-btn:hover {
  background: #5e1621;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.card h3 {
  margin-top: 0;
  color: #555;
  font-size: 16px;
}

.card p {
  font-size: 32px;
  margin: 0;
  font-weight: bold;
}

.charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.chart-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  height: 320px;
  position: relative;
  overflow: visible;
}

.table-container {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  overflow-x: auto;
  overflow-y: visible;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  font-size: 14px;
}

thead {
  background: #7b1e2b;
  color: white;
}

tr:hover {
  background: #f9f9f9;
}

.status-badge{
display:inline-block;
padding:5px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
color:white;
text-align:center;
min-width:95px;
}

.status-badge.ABIERTA{
background:#E67E22;
}

.status-badge.CERRADA{
background:#27AE60;
}

.status-badge.INFORMATIVA{
background:#2980B9;
}

.progress-cell{
display:flex;
align-items:center;
gap:10px;
margin-bottom:6px;
}

.progress-bar{
width:90px;
height:8px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:#7b1e2b;
border-radius:20px;
transition:.4s;
}
/* =========================================================
   TOOLTIP
========================================================= */

.tooltip-container {

  position: relative;

  cursor: pointer;

  color: #7b1e2b;

  font-weight: bold;

  text-decoration: underline dotted;

  display: inline-block;
}

/* CAJA */

.tooltip-box {

  visibility: hidden;

  position: absolute;

  top: 50%;

  right: 120%;

  transform: translateY(-50%);

  background: #2c3e50;

  color: white;

  padding: 16px;

  border-radius: 10px;

  box-shadow: 0 8px 24px rgba(0,0,0,.35);

  width: 360px;

  z-index: 999999;

  opacity: 0;

  transition: .2s;

  pointer-events: none;
}

/* MOSTRAR */

.tooltip-container:hover .tooltip-box {

  visibility: visible;

  opacity: 1;
}

/* FILAS */

.tooltip-row {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

  padding: 6px 0;

  border-bottom:
    1px solid rgba(255,255,255,.12);

  font-size: 12px;
}

.tooltip-row:last-child {

  border-bottom: none;
}

/* LABEL */

.tooltip-label {

  color: #dfe6e9;

  font-weight: 500;

  flex: 1;
}

/* VALUE */

.tooltip-value {

  color: #f1c40f;

  font-weight: bold;

  min-width: 60px;

  text-align: right;

  white-space: nowrap;
}

/* =========================================================
   RESPONSIVE
========================================================= */
.table-toolbar{

display:flex;
gap:15px;
margin-bottom:15px;
flex-wrap:wrap;
align-items:center;

}

.table-toolbar input{

padding:10px;
width:320px;
border:1px solid #ccc;
border-radius:6px;

}

.table-toolbar select{

padding:10px;
border-radius:6px;

}

@media(max-width:1000px){

  .charts {
    grid-template-columns: 1fr;
  }
}

@media(max-width:900px){

    padding: 10px;

    align-items: flex-start;

  .charts {

  }

    font-size: 28px;
  }

  h2 {
    font-size: 15px;
  }

  table {
    font-size: 12px;
  }

  th,
  td {
    padding: 8px;
  }

  .tooltip-box {

    width: 300px;

    right: auto;

    left: 50%;

    top: auto;

    bottom: 120%;

    transform: translateX(-50%);
  }
}

</style>

 async function loadData() {

  const { data, error } = await client
    .from('DAIAA')
    .select('*');

  if (error) {
    console.error(error);
    alert('Error cargando datos');
    return;
  }

  allData = data || [];

  fillFilters();
  updateDashboard(allData);
}

function fillFilters() {

  const years = [
    ...new Set(
      allData.map(x => x.anio).filter(Boolean)
    )
  ].sort((a, b) => b - a);

  const categories = [
    ...new Set(
      allData.map(x => x.CATEGORIA).filter(Boolean)
    )
  ].sort();

  const yearFilter =
    document.getElementById('yearFilter');

  const categoryFilter =
    document.getElementById('categoryFilter');

  years.forEach(year => {

    const option =
      document.createElement('option');

    option.value = year;
    option.textContent = year;

    yearFilter.appendChild(option);

  });

  categories.forEach(cat => {

    const option =
      document.createElement('option');

    option.value = cat;
    option.textContent = cat;

    categoryFilter.appendChild(option);

  });

}

function applyFilters() {

    let filtered = getFilteredData();

    // Buscar
    const texto = document.getElementById("searchInput").value.toUpperCase();

    if(texto){

        filtered = filtered.filter(row=>{

            return Object.values(row).join(" ")
                .toUpperCase()
                .includes(texto);

        });

    }

    // Estatus
    const status = document.getElementById("statusFilter").value;

    if(status){

        filtered = filtered.filter(x=>

            String(x.estatus)
            .toUpperCase()
            === status

        );

    }

    // Orden

    filtered.sort((a,b)=>{

        let A = a[currentSort] ?? "";
        let B = b[currentSort] ?? "";

        if(currentSort=="%avance"){

            A=parseFloat(String(A).replace("%",""))||0;
            B=parseFloat(String(B).replace("%",""))||0;

        }

        else{

            A=String(A).toUpperCase();
            B=String(B).toUpperCase();

        }

        if(A<B) return ascending?-1:1;
        if(A>B) return ascending?1:-1;

        return 0;

    });

    updateDashboard(filtered);

}
function sortBy(field){

    if(currentSort===field){

        ascending=!ascending;

    }else{

        currentSort=field;

        ascending=true;

    }

    applyFilters();

}

        rows === 99999
            ? data
            : data.slice(0, rows);

    sortedData.forEach(row => {

        // Obtener nombres reales de columnas
        const keys = Object.keys(row);

        const keyOficio = keys.find(k =>
            k.toLowerCase().includes("emisin_oficio")
        );

        const keyTecnica = keys.find(k =>
            k.toLowerCase().includes("evalua")
        );

        const keyControl = keys.find(k =>
            k.toLowerCase().includes("registro_control")
        );

        const keyEvidencia = keys.find(k =>
            k.toLowerCase().includes("envioderespuesta_evidencia")
        );

        // Valores para tooltip
        const rControl = formatStage(
            keyControl ? row[keyControl] : "0%"
        );

        const rOficio = formatStage(
            keyOficio ? row[keyOficio] : "0%"
        );

        const rEvidencia = formatStage(
            keyEvidencia ? row[keyEvidencia] : "0%"
        );

        const rEvTecnica = formatStage(
            keyTecnica ? row[keyTecnica] : "0%"
        );

        const rSeguimiento = formatStage(
            row["seguimiento"] || "0%"
        );

        const rEstFinal = formatStage(
            row["estatus_final"] ||
            row["estado_final"] ||
            "0%"
        );

        const avance =
            parseFloat(
                String(row["%avance"] || "0")
                    .replace("%","")
            ) || 0;

        htmlRows += `

<tr>

<td>${row.num_recomendacion || ''}</td>

<td>${row.num_expediente || ''}</td>

<td>${row.CATEGORIA || ''}</td>

<td>

<span class="status-badge ${String(row.estatus || '').toUpperCase()}">

${row.estatus || ''}

</span>

</td>

<td>

<div class="tooltip-container">

    <!-- Barra de avance -->
    <div class="progress-cell">

        <div class="progress-bar">
            <div class="progress-fill"
                 style="width:${avance}%">
            </div>
        </div>

        <span>${avance}%</span>

    </div>

<div class="tooltip-box">

<div class="tooltip-row">
<span class="tooltip-label">
REGISTRO Y CONTROL:
</span>
<span class="tooltip-value">
${rControl}
</span>
</div>

<div class="tooltip-row">
<span class="tooltip-label">
EMISIÓN OFICIO:
</span>
<span class="tooltip-value">
${rOficio}
</span>
</div>

<div class="tooltip-row">
<span class="tooltip-label">
RESPUESTA EVIDENCIA:
</span>
<span class="tooltip-value">
${rEvidencia}
</span>
</div>

<div class="tooltip-row">
<span class="tooltip-label">
EVALUACIÓN TÉCNICA:
</span>
<span class="tooltip-value">
${rEvTecnica}
</span>
</div>

<div class="tooltip-row">
<span class="tooltip-label">
SEGUIMIENTO:
</span>
<span class="tooltip-value">
${rSeguimiento}
</span>
</div>

<div class="tooltip-row">
<span class="tooltip-label">
ESTADO FINAL:
</span>
<span class="tooltip-value">
${rEstFinal}
</span>
</div>

</div>

</div>

</td>

</tr>

`;

    });

    tbody.innerHTML = htmlRows;

}

  function renderCharts(data, avg) {
    const categoryCounts = {};
    data.forEach(row => {
      if (row.CATEGORIA) {
        categoryCounts[row.CATEGORIA] = (categoryCounts[row.CATEGORIA] || 0) + 1;
      }
    });

    const labels = Object.keys(categoryCounts);
    const values = Object.values(categoryCounts);

    if (categoryChart) {
      categoryChart.destroy();
    }

    categoryChart = new Chart(document.getElementById('categoryChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Recomendaciones por Categoría',
          data: values,
          backgroundColor: '#7b1e2b'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });

    if (progressChart) {
      progressChart.destroy();
    }

    progressChart = new Chart(document.getElementById('progressChart'), {
      type: 'doughnut',
      data: {
        labels: ['Avance', 'Pendiente'],
        datasets: [{
          data: [avg, 100 - avg],
          backgroundColor: ['#A57F2C', '#D9D9D9']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }
 function renderDestinatariosChart(data) {

  const total = data.length;

  let afac = 0;
  let seneam = 0;

  const operadores = {};

  data.forEach(row => {

const dest =
  String(row.destinatario_recomendacion || '')
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "")
  .toUpperCase()
  .trim();

    // AFAC
    if (
      dest.includes('AGENCIA FEDERAL')
    ) {

      afac++;

    }

    // SENEAM
    else if (
      dest.includes('SERVICIOS A LA NAVEGACION') ||
      dest.includes('SENEAM')
    ) {

      seneam++;

    }

    // OPERADORES
    else {

      operadores[dest] =
        (operadores[dest] || 0) + 1;

    }

  });

  // =========================================
  // GRAFICA PRINCIPAL
  // =========================================

  const totalOperadores =
    Object.values(operadores)
    .reduce((a,b)=>a+b,0);

  if(destinatarioChart){
    destinatarioChart.destroy();
  }

  destinatarioChart =
    new Chart(
      document.getElementById('destinatarioChart'),
      {

        type: 'doughnut',

        data: {

          labels: [

            `AFAC (${((afac/total)*100).toFixed(1)}%)`,

            `SENEAM (${((seneam/total)*100).toFixed(1)}%)`,

            `OPERADORES (${((totalOperadores/total)*100).toFixed(1)}%)`

          ],

          datasets: [{

            data: [
              afac,
              seneam,
              totalOperadores
            ],

            backgroundColor: [
  '#7b1e2b',
  '#A57F2C',
  '#155B4E'
]

          }]

        },

        options: {

          responsive: true,

          maintainAspectRatio: false

        }

      }
    );

  // =========================================
  // GRAFICA OPERADORES
  // =========================================

  const operadoresOrdenados =
    Object.entries(operadores)
    .sort((a,b)=>b[1]-a[1]);

  const opLabels =
    operadoresOrdenados.map(x => {

      return x[0].length > 35
        ? x[0].substring(0,35) + '...'
        : x[0];

    });

  const opValues =
    operadoresOrdenados.map(x => x[1]);

  if(operadoresChart){
    operadoresChart.destroy();
  }

  operadoresChart =
    new Chart(
      document.getElementById('operadoresChart'),
      {

        type: 'bar',

        data: {

          labels: opLabels,

          datasets: [{

            label: 'Operadores',

            data: opValues,

            backgroundColor: '#155B4E'

          }]

        },

        options: {

          indexAxis: 'y',

          responsive: true,

          maintainAspectRatio: false,

          plugins: {

            legend: {
              display: false
            }

          },

          scales: {

            x: {
              beginAtZero: true
            }

          }

        }

      }
    );

}

  document.getElementById('yearFilter').addEventListener('change', applyFilters);
  document.getElementById('categoryFilter').addEventListener('change', applyFilters);

  loadData();
</script>
